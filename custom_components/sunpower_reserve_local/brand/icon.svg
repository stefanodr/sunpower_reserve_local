      <rect x="198" y="164" width="14" height="34" rx="3" opacity="0.3"/>
    </g>
  </g>
  <line x1="64" y1="191" x2="192" y2="191" stroke="#3a6382" stroke-width="1.5"/>
  <text x="128" y="210" text-anchor="middle" textLength="176" lengthAdjust="spacing" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="17" fill="#e6f0f7">SUNPOWER RESERVE</text>
  <text x="128" y="231" text-anchor="middle" textLength="64" lengthAdjust="spacing" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#3fb8a5">LOCAL</text>
